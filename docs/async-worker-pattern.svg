<svg width="1280" height="760" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vert.x Event Loop and Async Worker Patterns</title>
  <desc id="desc">Two asynchronous boundaries: concurrent HTTP fan-out on the event loop and accepted blocking work on worker threads.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="46%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eventLoop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="observe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#334155" stroke-width="1" opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-24%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#020617" flood-opacity="0.36"/>
    </filter>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#86efac"/>
    </marker>
    <marker id="arrowAmber" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 36px; fill: #f8fafc; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-weight: 500; font-size: 17px; fill: #cbd5e1; }
      .section { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 13px; fill: #e2e8f0; letter-spacing: 1.5px; }
      .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .small { font-family: Arial, Helvetica, sans-serif; font-weight: 500; font-size: 14px; fill: #cbd5e1; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 11px; fill: #94a3b8; letter-spacing: 0.6px; }
      .mono { font-family: Menlo, Monaco, Consolas, monospace; font-weight: 700; font-size: 13px; fill: #e2e8f0; }
      .lane { fill: #0b1220; fill-opacity: 0.72; stroke: #334155; stroke-opacity: 0.62; stroke-width: 1.2; }
      .card { fill: #111827; fill-opacity: 0.92; stroke: #475569; stroke-opacity: 0.58; stroke-width: 1.3; }
      .eventCard { stroke: #38bdf8; stroke-opacity: 0.72; }
      .workerCard { stroke: #34d399; stroke-opacity: 0.68; }
      .observeCard { stroke: #fbbf24; stroke-opacity: 0.68; }
      .chip { fill: #020617; fill-opacity: 0.66; stroke: #475569; stroke-opacity: 0.72; stroke-width: 1; }
      .blueLine { fill: none; stroke: #7dd3fc; stroke-width: 3.2; marker-end: url(#arrowBlue); }
      .greenLine { fill: none; stroke: #86efac; stroke-width: 3.2; marker-end: url(#arrowGreen); }
      .amberLine { fill: none; stroke: #fbbf24; stroke-width: 3.2; marker-end: url(#arrowAmber); }
      .returnLine { fill: none; stroke: #94a3b8; stroke-width: 2.2; stroke-dasharray: 8 8; marker-end: url(#arrowBlue); opacity: 0.72; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#08111f"/>
  <rect width="1280" height="760" rx="28" fill="url(#background)"/>
  <rect width="1280" height="760" rx="28" fill="url(#grid)"/>
  <circle cx="1070" cy="84" r="210" fill="url(#blueGlow)"/>
  <circle cx="160" cy="690" r="250" fill="url(#greenGlow)"/>

  <text x="58" y="72" class="title">Event Loop + Async Workers</text>
  <text x="58" y="103" class="subtitle">Compose non-blocking I/O. Isolate blocking work. Observe every handoff.</text>

  <rect x="952" y="48" width="210" height="38" rx="19" class="chip"/>
  <circle cx="976" cy="67" r="7" fill="#34d399"/>
  <text x="994" y="72" class="tiny">VERT.X + SPRING BOOT</text>

  <g transform="translate(58 128)">
    <rect width="1164" height="48" rx="24" fill="#020617" fill-opacity="0.48" stroke="#334155" stroke-opacity="0.7"/>
    <rect x="18" y="12" width="180" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="39" y="29" class="tiny">RECEIVE ON EVENT LOOP</text>
    <path d="M214 24H260" class="blueLine"/>
    <rect x="278" y="12" width="178" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="300" y="29" class="tiny">COMPOSE ASYNC I/O</text>
    <path d="M472 24H546" class="greenLine"/>
    <rect x="564" y="12" width="214" height="24" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="590" y="29" class="tiny">ISOLATE BLOCKING WORK</text>
    <path d="M794 24H868" class="amberLine"/>
    <rect x="886" y="12" width="248" height="24" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="958" y="29" class="tiny">OBSERVE RESULTS</text>
  </g>

  <g transform="translate(58 206)">
    <rect width="1164" height="206" rx="20" class="lane"/>
    <rect x="0" y="0" width="7" height="206" rx="3.5" fill="url(#eventLoop)"/>
    <text x="24" y="34" class="section">NON-BLOCKING HTTP FAN-OUT</text>
    <text x="24" y="59" class="small">Three inventory services run concurrently; one failure does not discard successful offers.</text>

    <g filter="url(#shadow)">
      <rect x="38" y="92" width="158" height="82" rx="16" class="card"/>
      <text x="78" y="126" class="label">Client</text>
      <text x="63" y="151" class="mono">HTTP request</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="260" y="72" width="184" height="122" rx="18" class="card eventCard"/>
      <rect x="284" y="94" width="136" height="28" rx="14" fill="url(#eventLoop)"/>
      <text x="314" y="113" class="tiny" fill="#082f49">EVENT LOOP</text>
      <text x="291" y="151" class="label">VertxFacade</text>
      <text x="301" y="175" class="small">route + trace</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="502" y="82" width="180" height="102" rx="16" class="card eventCard"/>
      <text x="540" y="122" class="label">WebClient</text>
      <text x="541" y="150" class="mono">Future.all</text>
      <text x="532" y="171" class="small">partial-safe join</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="744" y="72" width="382" height="122" rx="18" class="card eventCard"/>
      <text x="855" y="99" class="tiny">HTTP INVENTORY PROVIDERS</text>
      <rect x="764" y="112" width="102" height="58" rx="12" class="chip"/>
      <text x="788" y="136" class="mono">seoul</text>
      <text x="788" y="157" class="tiny">180 ms</text>
      <rect x="884" y="112" width="102" height="58" rx="12" class="chip"/>
      <text x="908" y="136" class="mono">busan</text>
      <text x="908" y="157" class="tiny">320 ms</text>
      <rect x="1004" y="112" width="102" height="58" rx="12" class="chip"/>
      <text x="1019" y="136" class="mono">incheon</text>
      <text x="1028" y="157" class="tiny">240 ms</text>
    </g>

    <path d="M196 133H254" class="blueLine"/>
    <path d="M444 133H496" class="blueLine"/>
    <path d="M682 133H738" class="blueLine"/>
    <path d="M744 181 C650 216 540 214 445 177" class="returnLine"/>
    <text x="505" y="201" class="tiny">combined result returns on the same event loop</text>
  </g>

  <g transform="translate(58 442)">
    <rect width="1164" height="230" rx="20" class="lane"/>
    <rect x="0" y="0" width="7" height="230" rx="3.5" fill="url(#observe)"/>
    <text x="24" y="34" class="section">ACCEPTED BACKGROUND JOB</text>
    <text x="24" y="59" class="small">A search-index rebuild returns 202 first, then continues on a worker thread.</text>

    <g filter="url(#shadow)">
      <rect x="38" y="102" width="158" height="82" rx="16" class="card"/>
      <text x="78" y="136" class="label">Client</text>
      <text x="75" y="161" class="mono">POST job</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="260" y="76" width="184" height="134" rx="18" class="card eventCard"/>
      <rect x="284" y="98" width="136" height="28" rx="14" fill="url(#eventLoop)"/>
      <text x="314" y="117" class="tiny" fill="#082f49">EVENT LOOP</text>
      <text x="291" y="155" class="label">Accept Job</text>
      <text x="300" y="180" class="small">create jobId</text>
      <text x="306" y="202" class="small">return 202</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="502" y="102" width="156" height="82" rx="16" class="card"/>
      <text x="543" y="136" class="label">Event Bus</text>
      <text x="531" y="161" class="mono">job command</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="720" y="76" width="190" height="134" rx="18" class="card workerCard"/>
      <rect x="744" y="98" width="142" height="28" rx="14" fill="url(#worker)"/>
      <text x="792" y="117" class="tiny" fill="#052e16">WORKER</text>
      <text x="756" y="155" class="label">Index Worker</text>
      <text x="756" y="180" class="small">blocking SDK call</text>
      <text x="764" y="202" class="small">publish snapshot</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="972" y="66" width="154" height="72" rx="16" class="card observeCard"/>
      <text x="1002" y="97" class="label">Job Status</text>
      <text x="999" y="121" class="mono">GET /jobs/{id}</text>
      <rect x="972" y="156" width="154" height="58" rx="16" class="card observeCard"/>
      <text x="990" y="181" class="label">Search + SSE</text>
      <text x="987" y="203" class="mono">/search + /events</text>
    </g>

    <path d="M196 143H254" class="blueLine"/>
    <path d="M444 143H496" class="blueLine"/>
    <path d="M658 143H714" class="greenLine"/>
    <path d="M910 105H966" class="greenLine"/>
    <path d="M910 180H966" class="amberLine"/>
    <path d="M263 196 C214 226 132 221 117 188" class="amberLine"/>
    <rect x="112" y="204" width="202" height="24" rx="12" fill="#422006" fill-opacity="0.68" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="134" y="221" class="tiny" fill="#fde68a">202 ACCEPTED IMMEDIATELY</text>
  </g>

  <g transform="translate(58 700)">
    <rect width="318" height="38" rx="19" fill="#082f49" fill-opacity="0.48" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="31" y="24" class="tiny">EVENT LOOP: ROUTE + ASYNC I/O</text>
    <rect x="342" width="326" height="38" rx="19" fill="#052e16" fill-opacity="0.48" stroke="#34d399" stroke-opacity="0.48"/>
    <text x="407" y="24" class="tiny">WORKER: BLOCKING WORK</text>
    <rect x="692" width="332" height="38" rx="19" fill="#422006" fill-opacity="0.48" stroke="#fbbf24" stroke-opacity="0.48"/>
    <text x="718" y="24" class="tiny">CLIENT: PARTIAL RESULT + JOB STATUS</text>
  </g>
</svg>
