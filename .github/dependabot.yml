version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      vertx:
        patterns:
          - "io.vertx:*"
        update-types:
          - minor
          - patch
      spring-integrations:
        patterns:
          - "org.springframework.boot:*"
          - "org.mybatis.spring.boot:*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
