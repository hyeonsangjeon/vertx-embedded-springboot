name: Documentation problem
description: Report a command, explanation, diagram, or example that is unclear or stale.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Page or section
      placeholder: README > Run the Whole Lab
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
